services:
  rechnungs-log:
    build: .
    container_name: ${CONTAINER_NAME:-rechnungs-log}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-rechnungen2026}
    networks:
      - default
      - proxy-network

networks:
  proxy-network:
    external: true


