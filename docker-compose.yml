services:
  rechnungs-log:
    build: .
    container_name: rechnungs-log
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - default
      - proxy-network

networks:
  proxy-network:
    external: true

